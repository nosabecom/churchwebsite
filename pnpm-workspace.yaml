packages:
  - apps/*
  - apps/studio/migrations/*
  - packages/*

catalog:
  '@sanity/client': ^7.26.2
  '@tailwindcss/vite': ^4.3.2
  '@vercel/analytics': ^2.0.1
  astro: 7.0.6
  astro-portabletext: ^0.13.0
  groq: ^6.9.2
  sharp: ^0.35.3
  tailwindcss: ^4.3.2
  vite: ^8.1.3

catalogMode: prefer

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.1'
  - '@astrojs/markdown-satteri@0.3.3'
  - astro@7.0.6

onlyBuiltDependencies:
  - esbuild
  - sharp
