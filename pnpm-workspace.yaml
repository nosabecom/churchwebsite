packages:
  - apps/*
  - packages/*

catalog:
  '@tailwindcss/vite': ^4.3.3
  '@vercel/analytics': ^2.0.1
  astro: 7.4.1
  sharp: ^0.35.5
  tailwindcss: ^4.3.3

catalogMode: prefer

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.1'
  - '@astrojs/markdown-satteri@0.3.3'

onlyBuiltDependencies:
  - esbuild
  - sharp
