  - "@astrojs/markdown-satteri@0.3.3"
  - "@sanity/blueprints@0.23.6"
  - "@sanity/functions@1.6.6"

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  '@sanity/runtime-cli': 17.4.0
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  smol-toml@<1.8.1: ^1.8.1
  undici@>=7.0.0 <7.29.1: 7.29.1
  adm-zip@<0.6.1: 0.6.1
  typeid-js>uuid: 11.1.1

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
