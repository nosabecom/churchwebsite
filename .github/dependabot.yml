version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: coming-soon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    target-branch: production
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    target-branch: production-womanexcel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
