name: Build verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
  PUBLIC_SANITY_DATASET: development
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
  SANITY_STUDIO_DATASET: development

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
          standalone: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated Sanity types
        run: pnpm typegen:check

      - name: Build all workspaces
        run: pnpm build

      - name: Verify generated routes and internal links
        run: pnpm verify:routes

      - name: Audit dependencies
        run: pnpm audit --ignore GHSA-vfj7-8cjw-p6xm
